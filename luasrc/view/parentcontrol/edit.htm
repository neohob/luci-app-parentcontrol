<% include("cbi/map") %>
<style type="text/css">
	/* 勾了「不限额度」→ 收起同档案的「每日分钟」和「共享组」两行。
	   选择器刻意**不引用 input 的 id**：这台机上 Checkbox 的 <input> 拿不到
	   label[for] 指的那个 id（浏览器会报 "Incorrect use of <label for=FORM_ELEMENT>"），
	   所以按 input[id$=...] 永远选不中；这里只靠**行 div 的 id**（服务端渲染的，稳定）
	   + 行内有 checked 的 checkbox。
	   为什么用 CSS 而不是 JS：
	     1) 这台路由器是 LuCI 的新式 JS 控件渲染（字段以 data-ui-widget 形式由前端 js
	        注入真正的 <input>），JS 里按 id 找控件会有"跑得比控件渲染还早"的时机问题；
	     2) LuCI 在 Flag 改变时会 cbi_d_update() 重渲染字段 DOM，JS 设的行内样式会被冲掉。
	   :has() 是声明式的：勾上/取消的那一刻立即生效，与渲染时机无关。
	   ~ 是兄弟选择器：quota/pool 两行都排在该档案「不限额度」那一行之后。 */
	.cbi-value[id$="-sd_unlimited"]:has(input:checked) ~ .cbi-value[id$="-sd_quota"],
	.cbi-value[id$="-sd_unlimited"]:has(input:checked) ~ .cbi-value[id$="-sd_pool"],
	.cbi-value[id$="-hd_unlimited"]:has(input:checked) ~ .cbi-value[id$="-hd_quota"],
	.cbi-value[id$="-hd_unlimited"]:has(input:checked) ~ .cbi-value[id$="-hd_pool"] {
		display: none !important;
	}
	/* 平日 / 节假日两组的字段原来是一长串堆在一起，看不出分组：
	   给「节假日」那组的首行加一条分隔线 + 上边距（纯 CSS，不依赖 CBI 的控件渲染）。 */
	.cbi-value[id$="-hd_qstart"] {
		border-top: 1px solid rgba(128, 128, 128, .38);
		margin-top: 16px;
		padding-top: 12px;
	}
	.cbi-value[id$="-sd_pool"] { margin-bottom: 4px; }
</style>
<script type="text/javascript">//<![CDATA[
	// 「起必须早于止」+「额度 ≤ 可用时段长度」的即时软提示（只提示，不拦提交；
	// 后端另有兜底：脏数据按"不限制时段"处理，绝不会因此把设备整天封死）。
	(function () {
		function pars(t) {
			var m = /^(\d?\d):(\d\d)(?::(\d\d))?$/.exec(t || '');
			return m ? (parseInt(m[1], 10) * 3600 + parseInt(m[2], 10) * 60 + (m[3] ? parseInt(m[3], 10) : 0)) : null;
		}
		// 一律按 name 找控件：这台 LuCI 的 Checkbox/Textfield 渲染**不给 <input> 设
		// label[for] 指的那个 id**（浏览器会报 Incorrect use of <label for=FORM_ELEMENT>），
		// 所以 input[id$=...] 永远选不中；name 属性是稳定存在的。
		function val(sfx) {
			var el = document.querySelector('input[name$=".' + sfx + '"]');
			return el ? el.value : null;
		}
		function warn() {
			var el = document.getElementById('pc-warn');
			if (el) return el;
			// cbi/map 自带 header/footer，模板里插 div 会落到 </html> 之后，所以用 JS 插
			el = document.createElement('div');
			el.id = 'pc-warn';
			el.style.cssText = 'color:#c00;font-weight:bold;margin:4px 0';
			var host = document.querySelector('.cbi-map') || document.body;
			host.insertBefore(el, host.firstChild);
			return el;
		}
		function check() {
			var out = ['sd', 'hd'].map(function (sfx) {
				var qs = val(sfx + '_quota'), ss = val(sfx + '_qstart'), es = val(sfx + '_qend');
				var uEl = document.querySelector('input[name$=".' + sfx + '_unlimited"]');
				if (qs === null || ss === null || es === null) return null;
				var name = (sfx === 'hd') ? '<%=translate("节假日")%>' : '<%=translate("平日")%>';
				var a = pars(ss), b = pars(es);
				if (a === null || b === null) return name + '：<%=translate("时间格式必须为 HH:MM:SS")%>';
				if (a >= b) return name + '：<%=translate("可用起必须早于可用止（不支持跨日时段）")%>';
				// 勾了不限额度 → 额度框已由 CSS 收起，也不再判额度
				if (uEl && uEl.checked) return null;
				var qv = parseInt(qs, 10);
				if (qs === '' || isNaN(qv)) return name + '：<%=translate("每日额度必填（填 0 = 一分钟都不给）")%>';
				var lim = Math.floor((b - a) / 60);
				if (qv > lim) return name + '：<%=translate("额度超过了可用时段长度")%>（' + lim + ' <%=translate("分钟")%>）';
				return null;
			}).filter(function (x) { return x !== null; });
			warn().innerHTML = out.length ? ('⚠ ' + out.join('；')) : '';
		}
		function boot() {
			check();
			document.addEventListener('keyup', check);
			document.addEventListener('change', check);
			document.addEventListener('click', check);
		}
		if (document.readyState === 'loading') {
			document.addEventListener('DOMContentLoaded', function () { setTimeout(boot, 200); });
		} else {
			setTimeout(boot, 200);
		}
	})();
//]]>
</script>
