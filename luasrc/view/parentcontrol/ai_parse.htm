<%+cbi/valueheader%>
<script src="<%=resource%>/parentcontrol/pc-ui.js"></script>
<div>
	<p class="cbi-value-description">
		<%=translate("点「AI 解析」：已经像域名/IP/CIDR 的项会直接放进「域名/IP」；其余名称（如应用名、游戏名）交给 AI 换成真实域名后追加进去。已存在的不重复添加，原内容不会被覆盖。")%>
	</p>
	<button type="button" id="pc-ai-parse-btn" class="cbi-button cbi-button-action"><%=translate("AI 解析")%></button>
	<span id="pc-ai-parse-msg" style="margin-left:8px"></span>
	<div id="pc-ai-parse-hint" class="cbi-value-description" style="display:none">
		<%=translate("解析失败不影响已填内容，可手动填写域名或 IP。")%>
	</div>
</div>
<script type="text/javascript">//<![CDATA[
	(function () {
		var btn = document.getElementById('pc-ai-parse-btn');
		var msg = document.getElementById('pc-ai-parse-msg');
		var hint = document.getElementById('pc-ai-parse-hint');
		if (!btn) return;

		function splitItems(v) {
			var out = [];
			if (!v) return out;
			var parts = v.split(/[\s,;、，；]+/);
			for (var i = 0; i < parts.length; i++) {
				if (parts[i] !== '') out.push(parts[i]);
			}
			return out;
		}

		// F4：res.direct / res.domains 必须是「字符串数组」才收。后端空列表已省键，
		// 但个别 LuCI 版本的 write_json 会把空表编成 {}（对象），concat 会把对象当
		// 元素追加成 "[object Object]" 脏数据 —— Array.isArray + string 过滤双保险。
		function toList(v) {
			if (!Array.isArray(v)) return [];
			var out = [];
			for (var i = 0; i < v.length; i++) {
				if (typeof v[i] === 'string' && v[i] !== '') out.push(v[i]);
			}
			return out;
		}

		btn.addEventListener('click', function () {
			var nameField = pcField('remarks');
			var domainsField = pcField('domains');
			var text = nameField ? nameField.value : '';
			if (text.replace(/[\s,;、，；]+/g, '') === '') {
				pcSetMsg(msg, '<%=translate("请先在上方填写要封锁的名称")%>', false);
				return;
			}
			pcSetMsg(msg, '<%=translate("正在解析…")%>', true);
			if (hint) hint.style.display = 'none';
			pcPost('<%=url("admin/control/parentcontrol/ai_parse")%>',
				{ text: text, token: '<%=token%>' },
				function (x, res) {
					if (!res || !res.ok) {
						pcSetMsg(msg, (res && res.error) ? res.error : '<%=translate("解析失败，请检查 AI 设置")%>', false);
						if (hint) hint.style.display = '';
						return;
					}
					// 追加而不覆盖：保留原列表，只补入新项（已存在的不重复添加）。
					var existing = splitItems(domainsField ? domainsField.value : '');
					var seen = {};
					for (var i = 0; i < existing.length; i++) {
						seen[existing[i]] = true;
					}
					var add = [];
					var direct = toList(res.direct);
					var domains = toList(res.domains);
					var items = direct.concat(domains);
					for (var j = 0; j < items.length; j++) {
						var it = items[j];
						if (!it || seen[it]) continue;
						seen[it] = true;
						add.push(it);
					}
					// A9（F-1 第二道防线）：有回应但既无直用项也无新域名 → 红字明确原因，不改 domains。
					if (add.length === 0 && direct.length === 0 && domains.length === 0) {
						pcSetMsg(msg, '<%=translate("AI 没有解析出合法域名，请手动填写域名或 IP")%>', false);
						if (hint) hint.style.display = '';
						return;
					}
					if (add.length && domainsField) {
						domainsField.value = existing.concat(add).join('\n');
					}
					var note = '<%=translate("新增")%>' + add.length + '<%=translate("项")%>';
					if (res.truncated) {
						note += '<%=translate("（名称过长已截断）")%>';
					}
					pcSetMsg(msg, note + '<%=translate("，确认后点「保存并应用」")%>', true);
				},
				function () {
					pcSetMsg(msg, '<%=translate("请求失败，请检查网络后重试")%>', false);
					if (hint) hint.style.display = '';
				});
		});
	})();
//]]>
</script>
<%+cbi/valuefooter%>
