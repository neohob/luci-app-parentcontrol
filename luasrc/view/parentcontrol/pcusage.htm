<%+cbi/valueheader%>
<div id="pc_usage_board" style="font-size:12px">…</div>
<script type="text/javascript">
//<![CDATA[
XHR.get('<%=url("admin/control/parentcontrol/usage")%>', null, function(x) {
	var el = document.getElementById('pc_usage_board');
	var d;
	try { d = JSON.parse(x.responseText); } catch (e) { el.innerHTML = '读取失败'; return; }
	var tname = { school: '平日', holiday: '节假日' };
	var h = '';
	h += '今天 <b>' + d.day + '</b>（' + (tname[d.type] || d.type) + '），'
	  + '额度发放时刻 <b>' + d.reset + '</b>' + (d.issued ? '' : '（尚未发放，当前封住）') + '<br/><br/>';
	if (d.items && d.items.length) {
		h += '<table class="cbi-section-table" style="width:auto">'
		  + '<tr class="cbi-section-table-titles"><th>条目</th><th>已用</th><th>额度</th><th>剩余</th></tr>';
		for (var i = 0; i < d.items.length; i++) {
			var it = d.items[i];
			var left = it.quota > 0 ? Math.max(0, it.quota - it.used) : '不限';
			h += '<tr class="cbi-section-table-row"><td>' + it.name + '</td><td>' + it.used + ' 分</td><td>'
			  + (it.quota > 0 ? it.quota + ' 分' : '不限') + '</td><td>' + left + (it.quota > 0 ? ' 分' : '') + '</td></tr>';
		}
		h += '</table>';
	} else {
		h += '当前没有处于「每日额度」模式的条目。';
	}
	if (d.history && d.history.length) {
		h += '<br/>最近 ' + d.history.length + ' 天总用量（分钟）：'
		  + '<table class="cbi-section-table" style="width:auto"><tr class="cbi-section-table-titles">';
		for (var j = 0; j < d.history.length; j++)
			h += '<th>' + d.history[j].date.slice(4, 6) + '-' + d.history[j].date.slice(6, 8) + '</th>';
		h += '</tr><tr class="cbi-section-table-row">';
		for (var k = 0; k < d.history.length; k++) h += '<td>' + d.history[k].minutes + '</td>';
		h += '</tr></table>';
	}
	el.innerHTML = h;
});
//]]>
</script>
<%+cbi/valuefooter%>
