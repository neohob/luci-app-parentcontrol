<% include("cbi/map") %>
<script src="<%=resource%>/parentcontrol/pc-ui.js?v=<%=require("luci.model.cbi.parentcontrol.pkgver").get()%>"></script>
<datalist id="pc-ai-models"></datalist>
<script type="text/javascript">//<![CDATA[
	(function () {
		var btn = document.getElementById('pc-ai-models-btn');
		var msg = document.getElementById('pc-ai-models-msg');
		var list = document.getElementById('pc-ai-models');

		// 关联 datalist：让「模型名称」输入框出现候选下拉。
		// F6：新式 LuCI 控件是 data-ui-widget 占位 div，真实 input 由前端 JS 异步注入，
		// 解析期 pcField('model') 只会拿到 null（同类时机问题的先例见 edit.htm 顶部注释）
		// —— 改为「点击时再找 + 加载后有限次重试」，找到并关联后即停。
		function bindModelList() {
			var el = pcField('model');
			if (el && el.tagName === 'INPUT' && el.getAttribute('list') !== 'pc-ai-models') {
				el.setAttribute('list', 'pc-ai-models');
			}
			return !!(el && el.getAttribute('list') === 'pc-ai-models');
		}

		(function retryBind(n) {
			if (bindModelList()) return;
			if (n > 0) setTimeout(function () { retryBind(n - 1); }, 200);
		})(10);

		if (btn) btn.addEventListener('click', function () {
			var ep = pcField('endpoint');
			var ak = pcField('apikey');
			// 点击时再关联一次（真实 input 可能此刻才注入完成）
			bindModelList();
			pcSetMsg(msg, '<%=translate("正在获取…")%>', true);
			pcPost('<%=url("admin/control/parentcontrol/ai_models")%>',
				{
					endpoint: ep ? ep.value : '',
					apikey: ak ? ak.value : '',
					token: '<%=token%>'
				},
				function (x, res) {
					if (!res || !res.ok) {
						pcSetMsg(msg, (res && res.error) ? res.error : '<%=translate("获取失败，请检查 endpoint 与网络")%>', false);
						return;
					}
					var models = res.models || [];
					if (list) {
						list.innerHTML = '';
						for (var i = 0; i < models.length; i++) {
							var op = document.createElement('option');
							op.value = models[i];
							list.appendChild(op);
						}
					}
					// 拉到候选后确保关联在位（下拉可用，B75 判据）
					bindModelList();
					pcSetMsg(msg, models.length
						? '<%=translate("获取到")%>' + models.length + '<%=translate("个模型，点输入框可下拉选择")%>'
						: '<%=translate("该接口未返回模型列表，请手动填写模型 id")%>',
						models.length > 0);
				},
				function () {
					pcSetMsg(msg, '<%=translate("请求失败，请检查网络或 endpoint")%>', false);
				});
		});
	})();
//]]>
</script>
